[project]
name = "school-mail-backend"
version = "1.0.0"
description = "校函 / IDEC 计科官网 后端 API"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",            # LTS，安全支持到 2028 年 4 月
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
    "django-cors-headers>=4.7",
    "django-environ>=0.12",
    "whitenoise>=6.9",
    "gunicorn>=23.0",
    # 课表日历工具：解析教务系统导出的 Excel 并生成 .ics
    "openpyxl>=3.1",              # .xlsx / .xlsm
    "xlrd>=2.0",                  # 老式 .xls（教务系统的课表导出仍在用）
    "icalendar>=6.0",             # 生成 iCalendar，负责转义与折行
]

[dependency-groups]
dev = [
    "django-extensions>=4.1",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
