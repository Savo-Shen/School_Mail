# 校函站点的 Nginx 配置（ideccs.savo-shen.com）
#
# 这台服务器的 nginx.conf 只 include conf.d/*.conf（sites-enabled/ 空且未被引用），
# 按「域名.conf」命名，所以：
#
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/ideccs.savo-shen.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 这份配置替换掉原来 certbot 生成的那份（原来是纯静态站点，
# 现在要加 SPA 回退和 /api/ 反代）。替换前记得备份：
#   sudo cp /etc/nginx/conf.d/ideccs.savo-shen.com.conf ~/ideccs.conf.bak
#
# 职责划分：
#   nginx  ->  index.html（4KB）+ /api/ 反代 + /admin/
#   R2+ESA ->  assets/、KeepRunning/、linzidaren/ 等 20MB 重资源
#              （构建时 base 指向 https://cdn.savo-shen.com/ideccs/）
#
# 前端和 API 同域，所以完全不需要 CORS。

server {
    listen 80;
    listen [::]:80;
    server_name ideccs.savo-shen.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ideccs.savo-shen.com;

    # 复用服务器上现成的 snippet：包含 *.savo-shen.com 泛域名证书 + TLS 参数
    include /etc/nginx/snippets/ssl-params.conf;

    root /var/www/ideccs;
    index index.html;

    access_log /var/log/nginx/ideccs.access.log;
    error_log  /var/log/nginx/ideccs.error.log;

    # ---------------------------------------------------------------- #
    # API：反代到 gunicorn。和前端同域，浏览器视角下是同源请求。
    # ---------------------------------------------------------------- #
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/proxy-params.conf;

        # 接口响应一律不缓存
        add_header Cache-Control "no-store" always;
    }

    # Django admin。建议再加 IP 白名单或 Cloudflare Access
    location /admin/ {
        # allow x.x.x.x;
        # deny all;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # Django admin 的静态文件（collectstatic 的产物）
    location /static/ {
        alias /home/savo_shen/school_mail/src/backend/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ---------------------------------------------------------------- #
    # 前端：SPA 回退。
    # /login、/study 这些路径在磁盘上没有对应文件，一律回落到 index.html，
    # 由 vue-router 接管 —— 这正是 R2 做不到、必须留一层 nginx 的原因。
    # ---------------------------------------------------------------- #
    location / {
        # $uri/ 这一段不能少：过渡期内 /var/www/ideccs 下还留着旧版的
        # KeepRunning/、linzidaren/ 等目录，只写 `$uri /index.html` 的话
        # 访问 /KeepRunning/ 会被当成前端路由吃掉，返回 SPA 而不是游戏。
        try_files $uri $uri/ /index.html;
    }

    # index.html 绝不能被缓存：它里面写死了带哈希的 assets 文件名，
    # 缓存住的话发新版后用户会一直加载旧资源。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
